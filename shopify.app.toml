# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c3acd6efa49cf6b3090d73de7c459b31"
name = "Scarcity Bar"
application_url = "https://scarcitybar.test/"
embedded = true
handle = "scarcitybar-app"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhook/customers-data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhook/customers-redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhook/shop-redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory,read_orders,read_themes,read_locations"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://scarcitybar.test/authenticate" ]

[pos]
embedded = false
